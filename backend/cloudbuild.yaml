steps:
# cloudbuild.yaml - Configurado para projeto decifra-mvp-v1
steps:
  # Build da imagem Docker do backend
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'southamerica-east1-docker.pkg.dev/decifra-mvp-v1/backend-images/backend:$COMMIT_SHA',
      '.'
    ]
  
  # Push da imagem para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'southamerica-east1-docker.pkg.dev/decifra-mvp-v1/backend-images/backend:$COMMIT_SHA']
  
  # Deploy no Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'backend-service'
      - '--image=southamerica-east1-docker.pkg.dev/decifra-mvp-v1/backend-images/backend:$COMMIT_SHA'
      - '--region=southamerica-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=decifra-builder@decifra-mvp-v1.iam.gserviceaccount.com'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'

# Configurações adicionais
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Valores válidos: UNSPECIFIED, N1_HIGHCPU_8, N1_HIGHCPU_32, E2_HIGHCPU_8, E2_HIGHCPU_32

timeout: '1200s'  # 20 minutos