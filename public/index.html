<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Decifra — Atoms</title>
    <!-- Viewport com safe-areas para iOS (notch) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Cor do tema (PWA) -->
    <meta name="theme-color" content="#4A90E2" />
    <!-- Evita iOS transformar números em links de telefone automaticamente -->
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA: Android e iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Preconnect fontes -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Tipografia: Nunito (800) e Inter (400/500/600) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@800&display=swap"
      rel="stylesheet"
    />

    <!-- Manifest/Icones -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para rodar o Decifra.</noscript>
    <div id="root"></div>
  </body>
</html>
